# spec-spine.toml governs this repository.
#
# hqgit is specified before it is built: the corpus under specs/ is the whole
# design, and the code under crates/ arrives one spec per driven session
# (AGENTS.md, "Working the backlog"). Every knob below is deliberate; see the
# spec-spine adoption guide for the full table.

[meta]
# The binary floor this repository is governed by (spec-spine 062). The CLI
# checks it on every run, so a contributor on an older binary is told which
# version to install instead of reading exit codes a verb never had. Bump it
# with the pin in AGENTS.md, README.md and .github/workflows/govern.yml.
required_version = ">=0.18.0"

[manifest]
# Cargo `[package.metadata.spec-spine].spec` and package.json `"spec-spine".spec`.
metadata_namespace = "spec-spine"

[domains]
# The `domain` of a spec is the architectural layer it lives in (spec 002 §2).
# Closed enum: a spec outside the layer model is a compile error (V-005), and a
# spec without a domain is a lint warning (L-002) that fails the gate.
allowed = [
  "governance",
  "l0-objects",
  "l1-ledger",
  "l2-domain",
  "l3-evaluation",
  "l4-trust",
  "l5-projection",
  "l6-policy",
  "l7-edge",
]

[kind]
# Closed enum (V-006 / L-003). `kernel` specs are load-bearing and hash-frozen;
# `feature` specs are replaceable above them; `tooling` is repo machinery.
allowed = [
  "constitutional-bootstrap",
  "thesis",
  "governance",
  "kernel",
  "feature",
  "tooling",
]

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
# cargo-fuzz keeps its own workspace under fuzz/ (spec 012); discover it too.
standalone_rust_workspaces = ["fuzz"]
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
# The review SPA (spec 095) is a standalone npm package, not a workspace.
standalone_npm_packages = ["web"]

[index]
# Beyond the always-hashed core (manifests, specs, span-backing sources): the
# surfaces that steer driven sessions, and the design doc the thesis cites.
extra_hashed_inputs = [
  "standards/**/*",
  ".github/workflows/**/*",
  ".claude/agents/**/*",
  ".claude/rules/**/*",
  ".claude/skills/**/*",
  ".claude/settings.json",
  "AGENTS.md",
  "CLAUDE.md",
  "Makefile",
  "scripts/**/*",
  ".githooks/**/*",
  ".gitattributes",
  ".mcp.json",
  ".github/dependabot.yml",
  "docs/design/**/*",
]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next", "data"]

[branding]
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
waiver_keyword = "Spec-Drift-Waiver:"
# Additive to the built-in floor (docs/, README.md, LICENSE, .derived/, lockfiles, ...).
# Per-crate READMEs are prose inside spec-owned crate directories.
bypass_prefixes = ["**/README.md", "**/CHANGELOG.md"]
# The ownership ratchet is on from day one (spec 032): this is a greenfield
# corpus, so every source file a session adds must be claimed by the spec it
# implements. C-002 refuses a changed file only a manifest floor covers.
require_ownership = true
# Dependabot-class version-pin bumps self-waive (spec 005 §3.5, spec 030).
auto_waive_dependency_only = true

[provenance.uri_schemes]
knowledge        = "knowledge://"
code-fingerprint = "fingerprint://"

[frontmatter]
# `wave` is the build-order wave a spec belongs to (spec 002 §6), carried
# verbatim into the registry for the orchestrator and the dashboards.
extra_known_keys = ["wave"]
