# The governed gate, re-run in CI exactly as `make ci` runs it locally
# (spec 001 B-3). claude-observatory's shepherd stage watches this workflow.
name: govern

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned to the version AGENTS.md names; bump both together.
  SPEC_SPINE_VERSION: v0.18.0

jobs:
  spine:
    name: spec-spine gate
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.tree.outputs.has_cargo }}
      has_deny: ${{ steps.tree.outputs.has_deny }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `hashFiles` is not available in a job-level `if` (its contexts are
      # github, needs, vars and inputs only), and a job-level `if` is
      # evaluated before any checkout anyway. The guard the Makefile applies
      # locally is therefore published as an output of this job.
      - name: Probe the tree
        id: tree
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f deny.toml ]; then
            echo "has_deny=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deny=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install spec-spine
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh \
            | SPEC_SPINE_VERSION="$SPEC_SPINE_VERSION" SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: spec-spine --version
      # One verb, both committed trees (spec-spine 075). It validates the
      # corpus AND proves the committed registry and index shards match it,
      # without writing: a gate that repairs what it judges hides the defect.
      # Never run it after a plain `compile` or `index` in the same job.
      #
      # `--fail-on-unresolved` is deliberately absent. It refuses while any
      # spec declares a file no code has created yet, which on this
      # specify-first corpus is true until the last wave lands; it is not the
      # `has_cargo` guard the coverage step below uses (spec 001 D-8).
      - run: spec-spine check --fail-on-warn
      - run: spec-spine lint --fail-on-warn
      - name: Coupling gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          spec-spine couple \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD \
            --pr-body "$RUNNER_TEMP/pr-body.txt"
      # The whole-tree ownership assertion: every source file inside a crate
      # is specifically claimed by a spec (spec 032 of spec-spine). A report
      # on every run; a refusal once a workspace exists, because spec-spine
      # 059 refuses an empty coverage universe rather than passing it
      # vacuously (spec 001 B-3, D-7).
      - run: spec-spine index coverage
      - if: steps.tree.outputs.has_cargo == 'true'
        run: spec-spine index coverage --fail-on-untraced
      - run: scripts/spec-dag.sh

  cargo:
    name: cargo gate
    needs: spine
    if: needs.spine.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml (spec 010).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check

  deny:
    name: supply chain (cargo-deny)
    needs: spine
    if: needs.spine.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  attest:
    name: corpus attestation
    needs: spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install spec-spine
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh \
            | SPEC_SPINE_VERSION="$SPEC_SPINE_VERSION" SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The reproducible attestation over the corpus and its coupling verdict
      # (spec-spine spec 023): the repo's own ledger seal, published as a
      # build artifact so a later steward can `verify-attestation --recompute`.
      #
      # The verb writes the attestation to `.derived/attestation/attestation.json`
      # and prints a human summary on stdout. Uploading a redirect of stdout
      # publishes the summary and drops the document, so the artifact is the
      # file the verb wrote, at the path `verify-attestation` reads by default.
      - run: spec-spine attest --with-coupling
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-attestation-${{ github.sha }}
          path: .derived/attestation/attestation.json
          if-no-files-found: error
